name: Live account audit (read-only)

# SELECT-only eight-account audit. Never remaps roles or resets passwords.
# Prefer resolving DATABASE_URL from the backend task definition (deploy role
# lacks ecs:RunTask). Never echoes the raw URL.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type AUDIT_READONLY to run'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::626357443497:role/qmis-github-deploy
  ECS_CLUSTER: qmis-erp
  ECS_SERVICE: qmis-backend

jobs:
  audit:
    if: ${{ inputs.confirm == 'AUDIT_READONLY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve DATABASE_URL and run SELECT audit
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition qmis-backend \
            --query taskDefinition > /tmp/taskdef.json

          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path

          td = json.loads(Path("/tmp/taskdef.json").read_text())
          containers = td.get("containerDefinitions") or []
          backend = next((c for c in containers if c.get("name") == "backend"), containers[0])
          env_map = {e["name"]: e.get("value") for e in (backend.get("environment") or []) if "name" in e}
          secrets = {s["name"]: s.get("valueFrom") for s in (backend.get("secrets") or []) if "name" in s}

          url = env_map.get("DATABASE_URL") or ""
          source = "taskdef.environment"
          if not url and "DATABASE_URL" in secrets:
              ref = secrets["DATABASE_URL"]
              secret_id = ref
              json_key = None
              # ECS form: arn:aws:secretsmanager:region:acct:secret:name-XXXX:jsonkey::
              if ":secret:" in ref:
                  left, right = ref.split(":secret:", 1)
                  segs = right.split(":")
                  secret_id = f"{left}:secret:{segs[0]}"
                  if len(segs) > 1 and segs[1]:
                      json_key = segs[1]
              print("Resolving DATABASE_URL from Secrets Manager (redacted)")
              out = subprocess.check_output(
                  [
                      "aws",
                      "secretsmanager",
                      "get-secret-value",
                      "--secret-id",
                      secret_id,
                      "--query",
                      "SecretString",
                      "--output",
                      "text",
                  ],
                  text=True,
              ).strip()
              try:
                  parsed = json.loads(out)
                  if isinstance(parsed, dict):
                      if json_key:
                          url = str(parsed.get(json_key) or "")
                      else:
                          url = str(
                              parsed.get("DATABASE_URL")
                              or parsed.get("database_url")
                              or parsed.get("url")
                              or (next(iter(parsed.values())) if len(parsed) == 1 else "")
                          )
                  else:
                      url = out
              except json.JSONDecodeError:
                  url = out
              source = "secretsmanager"

          if not url:
              print("NO_DATABASE_URL_IN_TASKDEF")
              print("env_keys", sorted(env_map))
              print("secret_keys", sorted(secrets))
              sys.exit(10)

          redacted = re.sub(r":[^:@/]+@", ":***@", url)
          print("DB_SOURCE", source)
          print("DB_HOST_REDACTED", redacted)
          if "localhost" in url or "127.0.0.1" in url:
              print("REFUSE_LOCALHOST")
              sys.exit(11)

          Path("/tmp/database_url").write_text(url, encoding="utf-8")
          PY

          python3 -m pip install -q "sqlalchemy>=2" "psycopg[binary]>=3"
          export DATABASE_URL="$(cat /tmp/database_url)"
          rm -f /tmp/database_url
          python3 backend/scripts/_live_eight_account_audit_readonly.py
          unset DATABASE_URL
