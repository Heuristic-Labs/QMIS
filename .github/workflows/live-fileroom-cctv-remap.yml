name: Live File Room / CCTV role remap

# One-shot maintenance: remap four live staff accounts to fileroom / cctv.
# Does not change passwords. Does not redeploy services.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REMAP_LIVE to run'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::626357443497:role/qmis-github-deploy
  ECS_CLUSTER: qmis-erp
  ECS_SERVICE: qmis-backend

jobs:
  read-only:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'REMAP_LIVE' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Read-only verify four emails
        env:
          REMAP_MODE: dry-run
        run: bash backend/scripts/_run_live_fileroom_cctv_remap_ecs.sh

  write-remap:
    needs: read-only
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'REMAP_LIVE' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Remap users.role_id + hr role_title
        env:
          REMAP_MODE: write
        run: bash backend/scripts/_run_live_fileroom_cctv_remap_ecs.sh
      - name: Fetch recent backend logs
        if: always()
        run: |
          set -euo pipefail
          GROUP=$(aws ecs describe-task-definition --task-definition qmis-backend \
            --query 'taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-group"' \
            --output text)
          echo "logGroup=$GROUP"
          if [ -z "$GROUP" ] || [ "$GROUP" = "None" ]; then
            exit 0
          fi
          STREAMS=$(aws logs describe-log-streams --log-group-name "$GROUP" \
            --order-by LastEventTime --descending --max-items 8 \
            --query 'logStreams[*].logStreamName' --output text)
          for s in $STREAMS; do
            echo "===== stream $s ====="
            aws logs get-log-events --log-group-name "$GROUP" --log-stream-name "$s" \
              --limit 80 --query 'events[*].message' --output text || true
          done
